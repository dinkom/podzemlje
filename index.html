<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="mobile-web-app-capable" content="yes">
<title>Noćnik</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #05070b; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #05070b; color: #e9dfc6; font: italic 20px Georgia, serif; align-items: center; justify-content: center; flex-direction: column; gap: 18px; text-align: center; }
  #rotate .ph { width: 46px; height: 80px; border: 3px solid #e9dfc6; border-radius: 9px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate"><div class="ph"></div>Okreni mobitel</div>
<script src="./lib/phaser.min.js"></script>
<script src="./js/sfx.js"></script>
<script src="./js/art.js"></script>
<script src="./js/tiles.js"></script>
<script src="./js/level.js"></script>
<script src="./js/suma.js"></script>
<script src="./js/suma2.js"></script>
<script src="./js/grad.js"></script>
<script src="./js/game.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
